[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dh-plugin-template"
version = "0.1.0"
description = "Reference starter for independently releasable Deckhand plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "deckhand-control-plane @ git+https://github.com/coollyninja/deckhand.git@c104c64fae427d3d2d0225ddb09ead0c72a2dbdc",
  "pydantic>=2.11,<3",
]

[project.entry-points."deckhand.plugins"]
dh-example = "dh_example.plugin:create_plugin"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dh_example"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dh_example"]
